name: Deploy

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Deploy to S3 + invalidate caches
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_IDS: ${{ vars.CLOUDFLARE_ZONE_IDS }}
          PUBLIC_REVISION_API_URL: ${{ secrets.PUBLIC_REVISION_API_URL }}
          PUBLIC_PHOTO_REPORT_AUTH: ${{ secrets.PUBLIC_PHOTO_REPORT_AUTH }}
          PUBLIC_VIP_VIDEO_6_JULIO_ID: ${{ secrets.PUBLIC_VIP_VIDEO_6_JULIO_ID }}
        run: pwsh -NoProfile -File ./deploy.ps1 --build --media-all -Yes
